services:
  # AI Copilot Service - AI-powered ERP assistance with Ollama integration
  ai-copilot:
    build:
      context: .
      dockerfile: ${AI_COPILOT_DOCKERFILE:-Dockerfile}
    container_name: ${COMPOSE_PROJECT_NAME:-erp-suite}-ai-copilot
    ports:
      - "8003:8003"  # HTTP API
      - "50055:50055"  # gRPC
    environment:
      # Service Configuration
      - SERVICE_NAME=ai-copilot
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8003
      
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=erp_ai_copilot
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_SSL_MODE=disable
      - DB_MAX_CONNECTIONS=20
      - DB_MIN_CONNECTIONS=5
      
      # MongoDB Configuration
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DATABASE=erp_ai_conversations
      - MONGODB_MAX_POOL_SIZE=10
      - MONGODB_MIN_POOL_SIZE=1
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      
      # Qdrant Configuration
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - QDRANT_API_KEY=
      - QDRANT_TIMEOUT=30
      
      # Kafka Configuration
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC_PREFIX=ai-copilot
      - KAFKA_CLIENT_ID=ai-copilot-service
      - KAFKA_GROUP_ID=ai-copilot-group
      - KAFKA_AUTO_OFFSET_RESET=earliest
      
      # AI Model Configuration
      - OLLAMA_BASE_URL=http://172.17.0.1:11434
      - DEFAULT_LLM_PROVIDER=gemini
      - DEFAULT_MODEL=gemini2.0:flash
      - GEMINI_API_KEY=AIzaSyDe79kNlJ_lGUXO5e-qka73mUpcvrynsBc
      - AI_DEFAULT_MODEL=gemini2.0:flash
      - AI_MAX_TOKENS=4000
      - AI_TEMPERATURE=0.7

      # Auth Service Configuration
      - AUTH_SERVICE_GRPC_HOST=auth-service
      - AUTH_SERVICE_GRPC_PORT=50051
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8003
      - GRPC_PORT=50055
      
      # CORS Configuration
      - CORS_ORIGINS="*"
      - SECURITY_CORS_ORIGINS="*"
      
      # Security
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - SECURITY_JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - SECURITY_JWT_ALGORITHM=HS256
      - SECURITY_JWT_EXPIRY_HOURS=24
      
      # Resource Limits
      - MAX_CONCURRENT_REQUESTS=100
      - REQUEST_TIMEOUT=300
      - MEMORY_LIMIT_MB=2048
      
      # Agent Configuration
      - AGENT_TIMEOUT_SECONDS=60
      - AGENT_MAX_RETRIES=3
      - AGENT_MEMORY_TTL_HOURS=24
      - AGENT_MAX_CONCURRENT=10
      
      # WebSocket Configuration
      - WS_MAX_CONNECTIONS=1000
      - WS_HEARTBEAT_INTERVAL=30
      - WS_CONNECTION_TIMEOUT=300
      - WS_MAX_MESSAGE_SIZE=1048576
      
      # gRPC Configuration
      - GRPC_MAX_WORKERS=10
      - GRPC_MAX_CONCURRENT_RPCS=100
      - GRPC_MAX_CONNECTION_IDLE=300
      - GRPC_MAX_CONNECTION_AGE=600
      - GRPC_MAX_MESSAGE_SIZE=52428800
      
      # RAG Configuration
      - RAG_ENABLED=true
      - RAG_COLLECTION_PREFIX=erp
      - RAG_EMBEDDING_MODEL=all-MiniLM-L6-v2
      - RAG_SIMILARITY_THRESHOLD=0.75
      - RAG_MAX_RESULTS=10
      - RAG_CHUNK_SIZE=1000
      - RAG_CHUNK_OVERLAP=200
      
      # Monitoring
      - METRICS_ENABLED=true
      - HEALTH_CHECK_INTERVAL=30
      - MONITORING_METRICS_ENABLED=true
      - MONITORING_HEALTH_CHECK_INTERVAL=30
      - MONITORING_PROMETHEUS_PORT=9090
      - MONITORING_LOG_LEVEL=info
      - MONITORING_LOG_FORMAT=json
      
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      qdrant:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 300s
      timeout: 100s
      retries: 3
      start_period: 60s
    command: ["python", "cmd/server.py", "--mode", "full", "--provider", "gemini", "--host", "0.0.0.0", "--port", "8003"]
    profiles:
      - ai-services
      - full-stack

networks:
  erp-network:
    external: true
    name: erp-suite_erp-network
