version: '3.8'

services:
  ai-copilot-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: erp-ai-copilot-dev
    ports:
      - "8003:8003"  # HTTP API
      - "50055:50055"  # gRPC
    volumes:
      # Mount source code for hot reloading
      - ./app:/app/app:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./config:/app/config:ro
    environment:
      # Service Configuration
      - SERVICE_NAME=ai-copilot
      - SERVICE_VERSION=1.0.0-dev
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - HOST=0.0.0.0
      - PORT=8003
      - RELOAD=true
      
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=erp_ai_copilot
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_SSL_MODE=disable
      - DB_MAX_CONNECTIONS=20
      - DB_MIN_CONNECTIONS=5
      
      # MongoDB Configuration
      - MONGODB_URI=mongodb://root:password@mongodb:27017/
      - MONGODB_DATABASE=erp_ai_conversations
      - MONGODB_MAX_POOL_SIZE=10
      - MONGODB_MIN_POOL_SIZE=1
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispassword
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      
      # Qdrant Configuration
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - QDRANT_API_KEY=
      - QDRANT_TIMEOUT=30
      
      # Kafka Configuration
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC_PREFIX=ai-copilot
      - KAFKA_CLIENT_ID=ai-copilot-service
      
      # Auth Service Configuration
      - AUTH_SERVICE_URL=http://auth-service:8001
      - AUTH_SERVICE_GRPC_URL=auth-service:50051
      - JWT_SECRET_KEY=your-secret-key-here
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24
      
      # API Gateway Configuration
      - API_GATEWAY_URL=http://api-gateway:8000
      - API_GATEWAY_INTERNAL_URL=http://api-gateway:8000
      
      # AI/ML Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEFAULT_MODEL=gpt-4
      - MAX_TOKENS=4000
      - TEMPERATURE=0.7
      
      # Vector Search Configuration
      - EMBEDDING_MODEL=text-embedding-ada-002
      - VECTOR_DIMENSION=1536
      - SIMILARITY_THRESHOLD=0.8
      
      # Rate Limiting
      - RATE_LIMIT_REQUESTS_PER_MINUTE=100
      - RATE_LIMIT_BURST_SIZE=20
      
      # Monitoring
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      - ENABLE_TRACING=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    networks:
      - erp-network
    depends_on:
      - postgres
      - mongodb
      - redis
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  erp-network:
    external: true
